{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
    <div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6 mt-6">
        <h1 class="text-2xl font-bold text-center mb-4">Iniciar sesión</h1>

        {# El formulario no tiene action: se envía a la misma URL y conserva ?next= #}
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-medium mb-1">Usuario</label>
                <input id="username" type="text" name="username" required autofocus autocomplete="username"
                       class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium mb-1">Contraseña</label>
                <input id="password" type="password" name="password" required autocomplete="current-password"
                       class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Entrar</button>
        </form>
    </div>
{% endblock %}
